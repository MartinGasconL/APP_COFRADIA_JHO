version: "3.9"

services:

  # â”€â”€ Base de datos â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  aseint-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aseint
      MYSQL_USER: aseint
      MYSQL_PASSWORD: aseint
    ports:
      - "3306:3306"
    volumes:
      - aseint-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "aseint", "-paseint"]
      interval: 10s
      timeout: 5s
      retries: 5

  # â”€â”€ Backup de la base de datos (diario/semanal/mensual) â”€â”€â”€â”€â”€â”€â”€â”€â”€
  aseint-db-backup:
    build: ./backup
    environment:
      MYSQL_HOST: aseint-db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: aseint
      DAILY_KEEP: 7
      WEEKLY_KEEP: 4
      MONTHLY_KEEP: 2
    volumes:
      - aseint-db-backups:/backup
    depends_on:
      aseint-db:
        condition: service_healthy

  # â”€â”€ Almacenamiento de documentos â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  aseint-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aseint
      MINIO_ROOT_PASSWORD: aseint123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Consola web  â†’  http://localhost:9001
    volumes:
      - aseint-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crea el bucket inicial en cuanto MinIO estÃ¡ listo
  aseint-storage-init:
    image: minio/mc:latest
    depends_on:
      aseint-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://aseint-storage:9000 aseint aseint123;
        mc mb --ignore-existing local/aseint-docs;
        mc anonymous set download local/aseint-docs;
        exit 0;
      "

  # â”€â”€ GUI Kong â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  konga:
    image: pantsel/konga:latest
    environment:
      DB_ADAPTER: sqlite
      DB_DATABASE: /app/kongadata/konga.db
      NODE_ENV: development
    ports:
      - "1337:1337"   # Consola web  â†’  http://localhost:1337
    volumes:
      - konga-data:/app/kongadata
    depends_on:
      kong:
        condition: service_healthy

  # â”€â”€ API Gateway â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  kong:
    image: kong:3.6
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yaml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"   # Proxy  â†’  toda la API entra por aquÃ­
      - "8001:8001"   # Admin API (solo local)
    volumes:
      - ../kong/kong.yaml:/kong/kong.yaml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aseint-db-data:
  aseint-db-backups:
  aseint-storage-data:
  konga-data:

